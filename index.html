<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Language Translator</h1>
        <p class="subtitle">Translate text into different languages</p>

        <!-- Language Selection -->
        <div class="language-box">

            <div class="language">
                <label>From</label>

                <select id="sourceLang">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="mr">Marathi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>

            <div class="arrow">→</div>

            <div class="language">
                <label>To</label>

                <select id="targetLang">
                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="mr">Marathi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>

        </div>


        <!-- Input -->
        <label class="section-label">Enter Text</label>

        <textarea
            id="inputText"
            placeholder="Type your text here..."
        ></textarea>

        <p id="counter">0 Characters</p>


        <!-- Translate Button -->
        <button class="translate-btn" onclick="translateText()">
            Translate
        </button>

        <div id="loader" class="loader"></div>


        <!-- Output -->
        <label class="section-label">Translated Text</label>

        <textarea
            id="outputText"
            placeholder="Translation will appear here..."
            readonly
        ></textarea>


        <!-- Copy -->
        <div class="actions">
            <button class="copy-btn" onclick="copyText()">
                Copy
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
